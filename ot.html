<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아난티 교육팀 OT 자료</title>
  <style>
    :root { color-scheme: dark; font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #090b0d; color: #f3f4f6; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 72px; padding: 14px 24px; border-bottom: 1px solid #30363d; background: #111417; }
    .title { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .mark { display: grid; place-items: center; width: 38px; height: 38px; flex: none; border: 1px solid #936a44; border-radius: 10px; color: #c59b6d; font-size: 13px; font-weight: 800; }
    h1 { margin: 0 0 3px; font-size: 17px; line-height: 1.3; }
    .sub { margin: 0; color: #aab2bd; font-size: 12px; }
    nav { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    a { color: inherit; text-decoration: none; }
    nav a, nav button { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; padding: 7px 12px; border: 1px solid #4a525b; border-radius: 7px; background: transparent; color: #e8e9eb; font: inherit; font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer; }
    nav a:hover, nav a:focus-visible, nav button:hover, nav button:focus-visible { border-color: #c59b6d; color: #f3d3b0; }
    nav .screen-button { border-color: #936a44; color: #f3d3b0; }
    nav a.primary { background: #c59b6d; border-color: #c59b6d; color: #111417; }
    nav a.primary:hover, nav a.primary:focus-visible { background: #d5ae83; color: #111417; }
    main { padding: 18px 24px 24px; }
    .viewer-shell { position: relative; display: grid; place-items: center; width: 100%; height: calc(100vh - 160px); min-height: 480px; overflow: hidden; border: 1px solid #30363d; border-radius: 10px; background: #090b0d; }
    .slide-image { display: block; width: 100%; height: 100%; object-fit: contain; user-select: none; }
    .slide-counter { position: absolute; z-index: 2; top: 14px; left: 18px; padding: 7px 11px; border-radius: 7px; background: rgba(9, 11, 13, .78); color: #f3f4f6; font-size: 13px; font-weight: 700; }
    .slide-arrow { position: absolute; z-index: 2; top: 50%; transform: translateY(-50%); display: grid; place-items: center; width: 46px; height: 56px; border: 1px solid rgba(197, 155, 109, .75); border-radius: 9px; background: rgba(9, 11, 13, .8); color: #f3d3b0; font: inherit; font-size: 30px; cursor: pointer; }
    .slide-arrow:hover, .slide-arrow:focus-visible { background: rgba(25, 30, 36, .96); }
    .slide-arrow:disabled { opacity: .3; cursor: default; }
    .slide-arrow.previous { left: 16px; }
    .slide-arrow.next { right: 16px; }
    .fullscreen-exit { display: none; position: absolute; z-index: 2; top: 14px; right: 18px; padding: 9px 13px; border: 1px solid #c59b6d; border-radius: 7px; background: #111417; color: #f3d3b0; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
    .viewer-shell:fullscreen { width: 100vw; height: 100vh; min-height: 0; border: 0; border-radius: 0; background: #090b0d; }
    .viewer-shell:fullscreen .fullscreen-exit { display: block; }
    .viewer-hint { margin: 10px 0 0; color: #aab2bd; font-size: 12px; }
    .viewer-hint a { color: #e6b985; text-decoration: underline; }
    @media (max-width: 640px) {
      header { align-items: flex-start; flex-direction: column; padding: 12px 16px; }
      nav { justify-content: flex-start; }
      main { padding: 12px 16px 16px; }
      .viewer-shell { height: calc(100vh - 188px); min-height: 360px; }
      .slide-arrow { width: 36px; height: 46px; font-size: 24px; }
      .slide-arrow.previous { left: 8px; }
      .slide-arrow.next { right: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <span class="mark" aria-hidden="true">OT</span>
      <div>
        <h1>아난티 교육팀 OT 자료</h1>
        <p class="sub">강사 전달용 · PDF 5쪽</p>
      </div>
    </div>
    <nav aria-label="자료 메뉴">
      <a href="ananti_lecture_note.html">강의 노트</a>
      <button id="fullscreen-button" class="screen-button" type="button" aria-controls="viewer-shell" aria-pressed="false">전체 화면</button>
      <a href="ot/강사_전달용.pdf" target="_blank" rel="noopener">PDF 새 창</a>
      <a class="primary" href="ot/강사_전달용.pdf" download="강사_전달용.pdf">PDF 다운로드</a>
    </nav>
  </header>
  <main>
    <div class="viewer-shell" id="viewer-shell" tabindex="0" role="region" aria-label="OT 슬라이드 보기">
      <img class="slide-image" id="slide-image" src="ot/slides/slide-1.jpg" alt="아난티 OT 자료 1쪽" draggable="false">
      <span class="slide-counter" id="slide-counter" aria-live="polite">1 / 5</span>
      <button class="slide-arrow previous" id="previous-slide" type="button" aria-label="이전 장" disabled>‹</button>
      <button class="slide-arrow next" id="next-slide" type="button" aria-label="다음 장">›</button>
      <button class="fullscreen-exit" id="fullscreen-exit" type="button">전체 화면 종료 (Esc)</button>
    </div>
    <p class="viewer-hint">이전·다음 버튼 또는 키보드 ← →, Page Up/Down, 스페이스키로 한 장씩 넘길 수 있습니다. <a href="ot/강사_전달용.pdf" target="_blank" rel="noopener">PDF 원본 열기</a></p>
  </main>
  <script>
    const shell = document.getElementById('viewer-shell');
    const slideImage = document.getElementById('slide-image');
    const slideCounter = document.getElementById('slide-counter');
    const previousButton = document.getElementById('previous-slide');
    const nextButton = document.getElementById('next-slide');
    const enterButton = document.getElementById('fullscreen-button');
    const exitButton = document.getElementById('fullscreen-exit');
    const slides = Array.from({ length: 5 }, (_, index) => `ot/slides/slide-${index + 1}.jpg`);
    let currentSlide = 0;

    function showSlide(index) {
      if (index < 0 || index >= slides.length) return;
      currentSlide = index;
      slideImage.src = slides[index];
      slideImage.alt = `아난티 OT 자료 ${index + 1}쪽`;
      slideCounter.textContent = `${index + 1} / ${slides.length}`;
      previousButton.disabled = index === 0;
      nextButton.disabled = index === slides.length - 1;
    }

    previousButton.addEventListener('click', () => showSlide(currentSlide - 1));
    nextButton.addEventListener('click', () => showSlide(currentSlide + 1));

    document.addEventListener('keydown', (event) => {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.target instanceof Element && event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
      if (event.key === ' ' && event.target instanceof Element && event.target.closest('button, a')) return;
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) {
        event.preventDefault();
        showSlide(currentSlide + 1);
      } else if (['ArrowLeft', 'PageUp'].includes(event.key)) {
        event.preventDefault();
        showSlide(currentSlide - 1);
      }
    });

    enterButton.addEventListener('click', async () => {
      if (!shell.requestFullscreen) {
        window.open('ot/강사_전달용.pdf', '_blank', 'noopener');
        return;
      }
      try {
        await shell.requestFullscreen();
        shell.focus();
      } catch {
        window.alert('전체 화면을 열 수 없습니다. PDF 새 창 버튼을 이용해 주세요.');
      }
    });

    exitButton.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen();
    });

    document.addEventListener('fullscreenchange', () => {
      enterButton.setAttribute('aria-pressed', String(document.fullscreenElement === shell));
    });
  </script>
</body>
</html>
